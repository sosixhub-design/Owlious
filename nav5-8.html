<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owlious</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { outline: none; -webkit-user-select: none; user-select: none; }
  button:focus, button:active { outline: none; }

  body { margin: 0; background: #000000; color: #ffffff; font-family: Arial, Helvetica, sans-serif; }

  nav {
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 8px 12px 4px; background: #000000; border-bottom: 1px solid #ffffff;
  }

  .app-name { font-family: 'Audiowide', sans-serif; font-size: 22px; font-weight: 400; letter-spacing: 1px; color: #ffffff; }

  .nav-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .menu-btn { background: none; border: none; color: #ffffff; cursor: pointer; padding: 2px; display: flex; }
  .menu-btn svg { width: 22px; height: 22px; stroke: #ffffff; fill: none; stroke-width: 1.8; }

  .side-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 19; }
  .side-overlay.active { display: block; }
  .side-menu {
    position: fixed; top: 0; left: 0; bottom: 0; width: 210px; background: #000000;
    border-right: 1px solid #ffffff; z-index: 20; padding: 20px 14px;
    transform: translateX(-100%); transition: transform 0.2s ease;
  }
  .side-menu.active { transform: translateX(0); }
  .side-menu-item {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: #ffffff; font-size: 14px; padding: 12px 4px; border-bottom: 1px solid #222222; cursor: pointer;
  }
  .side-menu-item:hover { opacity: 0.7; }

  .nav-links { display: flex; align-items: center; width: 100%; justify-content: space-evenly; }

  .nav-btn {
    background: none; border: none; color: #ffffff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    padding: 5px 10px; border-radius: 0; transition: opacity 0.2s ease; position: relative; opacity: 0.75;
  }

  .nav-btn svg { width: 19px; height: 19px; stroke: #ffffff; fill: none; stroke-width: 1.8; }
  .nav-btn:hover { opacity: 1; }
  .nav-btn.active { opacity: 1; }
  .nav-btn.active::after {
    content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
    width: 100%; height: 2px; background: #ffffff; border-radius: 2px 2px 0 0;
  }

  main { padding: 30px; max-width: 700px; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }

  .top-row { display: flex; gap: 10px; margin-bottom: 24px; }

  .explore-heading {
    font-family: 'Audiowide', sans-serif; font-size: 17px; letter-spacing: 0.5px;
    color: #ffffff; margin: 4px 0 14px;
  }

  .search-bar {
    flex: 1; display: flex; align-items: center; gap: 8px;
    border: 2px solid #ffffff; border-radius: 8px; padding: 8px 12px;
  }

  .search-bar svg { width: 18px; height: 18px; stroke: #ffffff; fill: none; stroke-width: 2; flex-shrink: 0; }
  .search-bar input { background: none; border: none; outline: none; color: #ffffff; font-size: 14px; width: 100%; }
  .search-bar input::placeholder { color: #999999; }

  .recent-heading { font-size: 15px; font-weight: bold; margin: 4px 0 10px; color: #ffffff; }

  .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; }
  .filter-chip {
    flex: 0 0 auto; background: none; border: 1px solid #ffffff; color: #ffffff;
    border-radius: 14px; padding: 5px 13px; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .filter-chip.active { background: #ffffff; color: #000000; }

  /* --- AI chat page --- */
  .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 230px); min-height: 320px; }

  .chat-attach-wrap { position: relative; }

  .chat-model-menu {
    position: absolute; top: calc(100% + 8px); left: 0; width: 220px; background: #0a0a0a;
    border: 1px solid #ffffff; border-radius: 10px; padding: 6px; z-index: 30;
    display: flex; flex-direction: column; gap: 2px;
    opacity: 0; transform: translateY(-6px) scale(0.96); pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .chat-model-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .chat-model-item {
    background: none; border: none; color: #ffffff; text-align: left; font-size: 12px;
    padding: 9px 10px; border-radius: 6px; cursor: pointer;
  }
  .chat-model-item:hover { background: #1a1a1a; }
  .chat-model-item.active { background: #ffffff; color: #000000; }

  .chat-messages {
    flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
    gap: 10px; padding: 4px 2px 12px;
  }

  .chat-msg {
    max-width: 82%; padding: 10px 13px; border-radius: 14px; font-size: 13px; line-height: 1.45;
    word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .chat-msg.user { align-self: flex-end; background: #ffffff; color: #000000; border-bottom-right-radius: 3px; }
  .chat-msg.ai { align-self: flex-start; background: #111111; border: 1px solid #333333; color: #ffffff; border-bottom-left-radius: 3px; }
  .chat-msg .msg-file { display: block; margin-top: 6px; font-size: 11px; opacity: 0.7; }
  .chat-msg img.msg-thumb { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
  .chat-msg audio.msg-audio { width: 100%; margin-top: 6px; display: block; }

  .chat-attach-preview { display: flex; gap: 6px; overflow-x: auto; }
  .chat-attach-chip {
    flex: 0 0 auto; background: #111111; border: 1px solid #444444; border-radius: 8px;
    padding: 4px 8px; font-size: 10px; color: #cccccc; display: flex; align-items: center; gap: 6px;
  }
  .chat-attach-chip button { background: none; border: none; color: #ff6666; cursor: pointer; font-size: 12px; padding: 0; display: flex; }
  .chat-attach-chip .chat-model-item-icon { stroke: #cccccc; }
  .chat-attach-chip button svg { width: 12px; height: 12px; stroke: #ff6666; fill: none; stroke-width: 2; }

  .chat-input-box {
    display: flex; flex-direction: column; border: 1px solid #ffffff; border-radius: 18px;
    padding: 8px 8px 6px; margin-top: 6px;
  }

  .chat-textarea {
    background: none; border: none; color: #ffffff; font-size: 13px; padding: 4px 6px 8px;
    resize: none; max-height: 110px; overflow-y: auto; line-height: 1.35;
    font-family: Arial, Helvetica, sans-serif;
  }
  .chat-textarea:focus { outline: none; }

  .chat-toolbar { display: flex; align-items: center; justify-content: space-between; }

  .chat-plus-btn {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px; background: none;
    border: 1px solid #ffffff; color: #ffffff; border-radius: 16px; padding: 6px 11px 6px 8px; cursor: pointer;
  }
  .chat-plus-btn svg { width: 15px; height: 15px; stroke: #ffffff; fill: none; stroke-width: 2; }
  .chat-model-pill { font-size: 11px; color: #cccccc; }

  .chat-model-divider { height: 1px; background: #333333; margin: 4px 2px; }

  .chat-model-item { display: flex; align-items: center; gap: 8px; }
  .chat-model-item-icon { width: 14px; height: 14px; stroke: #ffffff; fill: none; stroke-width: 1.8; flex: 0 0 auto; }

  .chat-right-btns { display: flex; align-items: center; gap: 6px; }

  .chat-icon-btn {
    flex: 0 0 auto; background: none; border: 1px solid #ffffff; color: #ffffff;
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }
  .chat-icon-btn svg { width: 16px; height: 16px; stroke: #ffffff; fill: none; stroke-width: 1.8; }
  .chat-icon-btn.recording { background: #ff3b3b; border-color: #ff3b3b; }

  .chat-send-btn {
    flex: 0 0 auto; background: #ffffff; border: none; width: 34px; height: 34px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .chat-send-btn svg { width: 15px; height: 15px; stroke: #000000; fill: none; stroke-width: 2; }
  .chat-send-btn:disabled { opacity: 0.4; cursor: default; }

  .recent-scroll {
    display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 22px;
    scrollbar-width: thin; scrollbar-color: #ffffff #000000;
  }

  .recent-scroll::-webkit-scrollbar { height: 6px; }
  .recent-scroll::-webkit-scrollbar-thumb { background: #ffffff; border-radius: 3px; }

  .recent-card { flex: 0 0 92px; cursor: pointer; }

  .recent-card img, .recent-card .thumb-blank {
    width: 92px; height: 92px; object-fit: cover; border-radius: 8px;
    border: 1px solid #ffffff; display: block; background: #111111;
  }

  .recent-card .recent-title {
    font-size: 12px; margin-top: 6px; line-height: 1.3; color: #ffffff;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .recent-card .recent-meta { font-size: 10px; color: #999999; margin-top: 3px; }

  .empty-msg { color: #999999; font-size: 13px; text-align: center; padding: 30px 0; }
  .discover-promo {
    border: 1px dashed #ffffff; border-radius: 10px; padding: 18px; text-align: center;
    color: #ffffff; font-size: 13px; cursor: pointer; margin-bottom: 4px;
  }
  .discover-promo:hover { background: #111111; }
  .soon-box {
    border: 1px dashed #444444; border-radius: 10px; padding: 40px 20px;
    text-align: center; color: #999999; font-size: 13px;
  }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 10; }
  .overlay.active { display: block; }

  .view-panel {
    position: fixed; left: 0; right: 0; top: 50%; transform: translate(0, -50%) scale(0.9);
    background: #000000; border: 2px solid #ffffff; border-radius: 12px; padding: 20px;
    max-width: 600px; width: 90%; margin: 0 auto; z-index: 11; max-height: 85vh; overflow-y: auto;
    opacity: 0; pointer-events: none; transition: 0.2s ease;
  }

  .view-panel.active { opacity: 1; pointer-events: auto; transform: translate(0, -50%) scale(1); }
  .view-panel h3 { margin-top: 0; color: #ffffff; }

  .view-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: #999999; margin-bottom: 12px; }

  .close-btn {
    margin-top: 14px; width: 100%; background: none; border: 2px solid #ffffff; color: #ffffff;
    border-radius: 8px; padding: 8px; cursor: pointer; font-weight: bold;
  }
  .close-btn:hover { background: #ffffff; color: #000000; }
  .close-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .close-btn:disabled:hover { background: none; color: #ffffff; }

  .drop-zone {
    border: 2px dashed #ffffff; border-radius: 8px; padding: 22px; text-align: center;
    cursor: pointer; font-size: 12px; color: #999999; margin-bottom: 14px;
  }
  .drop-zone:hover { background: #111111; }

  .preview-canvas, .preview-audio-box {
    width: 100%; border: 1px solid #ffffff; border-radius: 6px; margin-bottom: 14px; background: #050505;
  }
  .preview-canvas { display: block; max-height: 260px; object-fit: contain; }
  .preview-audio-box { padding: 16px; display: none; }
  .preview-audio-box audio { width: 100%; }

  .params-heading { font-size: 13px; font-weight: bold; margin: 4px 0 10px; color: #ffffff; }

  .param-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
  .param-row .param-label { flex: 0 0 110px; color: #999999; }
  .param-row input[type="range"] { flex: 1; accent-color: #ffffff; }
  .param-row input[type="color"] { width: 40px; height: 26px; border: 1px solid #ffffff; border-radius: 4px; background: none; padding: 0; }
  .param-row .param-value { flex: 0 0 46px; text-align: right; color: #ffffff; }

  .rendering-note { font-size: 11px; color: #666666; margin-top: 10px; text-align: center; }

  /* --- Per-param timeline / animation (image effects only) --- */
  .anim-toggle {
    flex: 0 0 auto; display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: #00ccff; cursor: pointer; white-space: nowrap;
  }
  .anim-toggle input { accent-color: #00ccff; }

  .anim-config {
    border: 1px solid #222222; border-radius: 8px; padding: 10px;
    margin: 4px 0 14px; background: #050505;
  }

  .anim-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 11px; }
  .anim-row span { flex: 0 0 80px; color: #999999; }
  .anim-row input[type="number"] {
    flex: 1; background: #000000; color: #ffffff; border: 1px solid #333333;
    border-radius: 5px; padding: 4px 6px; font-size: 12px; outline: none;
  }

  .envelope-box { width: 100%; height: 90px; touch-action: none; }
  .envelope-line { stroke: #00ccff; stroke-width: 2; fill: none; }
  .envelope-grid { stroke: #222222; stroke-width: 1; }
  .envelope-handle { fill: #00ccff; stroke: #000000; stroke-width: 1; cursor: grab; }
  .envelope-handle:active { cursor: grabbing; fill: #66e0ff; }

  .timeline-box { margin: 4px 0 16px; }
  .timeline-controls { display: flex; align-items: center; gap: 8px; }
  .play-btn {
    flex: 0 0 auto; background: none; border: 2px solid #00ccff; color: #00ccff;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .play-btn:hover { background: #00ccff; color: #000000; }
  .timeline-controls input[type="range"] { flex: 1; accent-color: #00ccff; }
  .timeline-time { flex: 0 0 46px; text-align: right; font-size: 11px; color: #999999; }
</style>
</head>
<body>

<nav>
  <div class="nav-top">
    <button class="menu-btn" onclick="toggleSideMenu()" title="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="app-name">Owlious</span>
  </div>
  <div class="nav-links">
    <button class="nav-btn" data-page="all" onclick="showPage('all')" title="All">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <button class="nav-btn" data-page="assets" onclick="showPage('assets')" title="Assets">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </button>
    <button class="nav-btn" data-page="sfx" onclick="showPage('sfx')" title="SFX">
      <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 5V5l-5 5H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>
    </button>
    <button class="nav-btn" data-page="packs" onclick="showPage('packs')" title="Packs">
      <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
    </button>
    <button class="nav-btn" data-page="ai" onclick="showPage('ai')" title="AI">
      <svg viewBox="0 0 24 24"><path d="M12 2l1.6 4.4L18 8l-4.4 1.6L12 14l-1.6-4.4L6 8l4.4-1.6L12 2z"/><path d="M19 15l0.8 2.2L22 18l-2.2 0.8L19 21l-0.8-2.2L16 18l2.2-0.8L19 15z"/></svg>
    </button>
  </div>
</nav>

<div class="side-overlay" id="sideOverlay" onclick="closeSideMenu()"></div>
<div class="side-menu" id="sideMenu">
  <button class="side-menu-item" onclick="goToPage('all')">All</button>
  <button class="side-menu-item" onclick="goToPage('assets')">Assets</button>
  <button class="side-menu-item" onclick="goToPage('sfx')">SFX</button>
  <button class="side-menu-item" onclick="goToPage('packs')">Packs</button>
  <button class="side-menu-item" onclick="goToPage('ai')">AI</button>
</div>

<main>

  <section id="assets" class="page">
    <div class="explore-heading">Explore Assets</div>
    <div class="top-row">
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" class="searchInput" data-category="assets" placeholder="Search assets..." oninput="renderCategory('assets')">
      </div>
    </div>
    <div class="recent-heading">Trending</div>
    <div class="recent-scroll" data-list="trending"></div>
    <div class="filter-chips" data-filterrow="assets"></div>
    <div class="recent-heading">Browse</div>
    <div class="recent-scroll" data-list="assets"></div>
  </section>

  <section id="sfx" class="page">
    <div class="explore-heading">Explore SFX</div>
    <div class="top-row">
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" class="searchInput" data-category="sfx" placeholder="Search SFX..." oninput="renderCategory('sfx')">
      </div>
    </div>
    <div class="filter-chips" data-filterrow="sfx"></div>
    <div class="recent-heading">Browse</div>
    <div class="recent-scroll" data-list="sfx"></div>
  </section>

  <section id="packs" class="page">
    <div class="explore-heading">Explore Packs</div>
    <div class="soon-box">Packs are coming soon.</div>
  </section>

  <section id="all" class="page">
    <div class="explore-heading">Explore All</div>
    <div class="top-row">
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" class="searchInput" data-category="all" placeholder="Search everything..." oninput="renderCategory('all')">
      </div>
    </div>
    <div class="recent-heading">Browse</div>
    <div class="recent-scroll" data-list="all"></div>

    <div class="recent-heading">Best</div>
    <div class="recent-scroll" data-discover="best"></div>
    <div class="recent-heading">Trending</div>
    <div class="recent-scroll" data-discover="trending2"></div>
    <div class="recent-heading">Most Downloaded</div>
    <div class="recent-scroll" data-discover="mostdl"></div>
    <div class="recent-heading">New Arrivals</div>
    <div class="recent-scroll" data-discover="new"></div>
    <div class="recent-heading">Best Theme</div>
    <div class="recent-scroll" data-discover="featured"></div>
    <div class="recent-heading">Fantasy</div>
    <div class="recent-scroll" data-discover="fantasy"></div>
    <div class="recent-heading">Sci-Fi</div>
    <div class="recent-scroll" data-discover="scifi"></div>
    <div class="recent-heading">Cyberpunk</div>
    <div class="recent-scroll" data-discover="cyberpunk"></div>
    <div class="recent-heading">Horror</div>
    <div class="recent-scroll" data-discover="horror"></div>
    <div class="recent-heading">More Packs</div>
    <div class="discover-promo" onclick="showPage('packs')">Browse all Packs →</div>
  </section>

  <section id="ai" class="page">
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-attach-preview" id="chatAttachPreview"></div>
      <div class="chat-input-box">
        <textarea class="chat-textarea" id="chatInput" rows="1" placeholder="Message Owlious AI..." oninput="autoGrowChatInput(this)" onkeydown="onChatKeydown(event)"></textarea>
        <div class="chat-toolbar">
          <div class="chat-attach-wrap">
            <button class="chat-plus-btn" onclick="toggleModelMenu()" title="Attach a file or choose the AI model">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              <span class="chat-model-pill" id="chatModelPill">Pollinations</span>
            </button>
            <div class="chat-model-menu" id="chatModelMenu">
              <button class="chat-model-item" onclick="document.getElementById('chatFileInput').click(); closeModelMenu();">
                <svg viewBox="0 0 24 24" class="chat-model-item-icon"><path d="M21 12.5V7a2 2 0 0 0-2-2H8L4 9v8a2 2 0 0 0 2 2h4"/><path d="M14 21l6-6M14 15h6v6"/></svg>
                Attach file
              </button>
              <div class="chat-model-divider"></div>
              <button class="chat-model-item" data-model="pollinations" onclick="selectAiModel('pollinations')">Pollinations (free, no key needed)</button>
              <button class="chat-model-item" data-model="cloudflare" onclick="selectAiModel('cloudflare')">Cloudflare Workers AI (free tier)</button>
              <button class="chat-model-item" data-model="groq" onclick="selectAiModel('groq')">Groq (free tier)</button>
              <button class="chat-model-item" data-model="gemini" onclick="selectAiModel('gemini')">Gemini (free tier)</button>
              <button class="chat-model-item" data-model="openai" onclick="selectAiModel('openai')">OpenAI</button>
            </div>
          </div>
          <input type="file" id="chatFileInput" style="display:none" accept="image/*,application/pdf,.txt,.doc,.docx" onchange="onChatFilePicked(event)">
          <div class="chat-right-btns">
            <button class="chat-icon-btn" id="chatMicBtn" onclick="toggleVoiceRecording()" title="Voice message">
              <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
            </button>
            <button class="chat-send-btn" id="chatSendBtn" onclick="sendChatMessage()" title="Send">
              <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

<!-- Item panel: browse info + "apply to your own file" tool -->
<div class="view-panel" id="viewPanel">
  <h3 id="viewTitle"></h3>
  <div class="view-meta">
    <span id="viewUser"></span>
    <span id="viewType"></span>
    <span id="viewViews"></span>
  </div>

  <div class="drop-zone" id="dropZone" onclick="document.getElementById('userFileInput').click()">
    Click to upload your own file to apply this effect to
  </div>
  <input type="file" id="userFileInput" style="display:none" onchange="onUserFilePicked(event)">

  <canvas class="preview-canvas" id="previewCanvas" style="display:none;"></canvas>
  <div class="preview-audio-box" id="previewAudioBox"><audio id="previewAudio" controls></audio></div>

  <div id="viewParams" style="display:none;"></div>

  <div id="timelineSection" class="timeline-box" style="display:none;">
    <div class="params-heading">Timeline</div>
    <div class="timeline-controls">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">&#9654; Play</button>
      <input type="range" id="timelineScrub" min="0" max="1" step="0.005" value="0" oninput="onScrub(this.value)">
      <span class="timeline-time" id="timelineTimeLabel">0.0s</span>
    </div>
  </div>

  <div style="display:flex; gap:8px; margin-top:10px;">
    <button class="close-btn" id="downloadBtn" onclick="downloadResult()" disabled>Download Frame</button>
    <button class="close-btn" onclick="shareItem()">Share</button>
    <button class="close-btn" onclick="closeAllPanels()">Close</button>
  </div>
  <div class="rendering-note" id="renderingNote"></div>
</div>

<!-- Template for one animatable param's envelope editor (cloned per param) -->
<template id="envelopeTemplate">
  <svg class="envelope-box" viewBox="0 0 160 90" preserveAspectRatio="none">
    <line class="envelope-grid" x1="0" y1="45" x2="160" y2="45"></line>
    <line class="envelope-grid" x1="80" y1="0" x2="80" y2="90"></line>
    <polyline class="envelope-line" points=""></polyline>
  </svg>
</template>

<script src="effects.js"></script>
<script src="store.js"></script>
<script>
  // Standalone mode: no shared storage. If store.js / effects.js aren't present,
  // the page still works — the item lists are simply empty, and the AI chat
  // keeps its memory in each visitor's own browser.
  if (typeof PhantomStore === 'undefined') {
    window.PhantomStore = { getItems: async () => [], saveItem: function () {}, deleteItem: function () {} };
  }
  if (typeof EFFECT_TYPES === 'undefined') { window.EFFECT_TYPES = {}; }

  let currentItem = null;
  let paramValues = {};
  let animConfig = {}; // animConfig[itemId][paramKey] = { enabled, start, end, duration, nodes }
  let categoryFilter = { assets: 'all', sfx: 'all' }; // selected filter-chip type per category

  // Timeline playback state
  let maxDuration = 2;
  let playheadTime = 0;
  let isPlaying = false;
  let playRafId = null;
  let playLastTs = null;

  // Image path state
  let userImageEl = null;
  // Audio path state
  let userAudioBuffer = null;
  let renderedAudioBlob = null;
  let audioRenderTimer = null;

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelector('.nav-btn[data-page="' + id + '"]').classList.add('active');
  }

  function toggleSideMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
    document.getElementById('sideOverlay').classList.toggle('active');
  }

  function closeSideMenu() {
    document.getElementById('sideMenu').classList.remove('active');
    document.getElementById('sideOverlay').classList.remove('active');
  }

  function goToPage(id) {
    showPage(id);
    closeSideMenu();
  }

  // Defined here so this page never depends on another file providing it.
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function cardHtml(it) {
    return `
      <div class="recent-card" onclick="openItem(${it.id})">
        ${it.thumbnail ? `<img src="${it.thumbnail}" alt="${escapeHtml(it.title)}">` : '<div class="thumb-blank"></div>'}
        <div class="recent-title">${escapeHtml(it.title)}</div>
        <div class="recent-meta">${it.type} · ${it.views} views</div>
      </div>
    `;
  }

  async function renderCategory(category) {
    const row = document.querySelector('.recent-scroll[data-list="' + category + '"]');
    if (!row) return;
    const input = document.querySelector('.searchInput[data-category="' + category + '"]');
    const query = (input ? input.value : '').toLowerCase();
    const activeFilter = categoryFilter[category] || 'all';

    const allItems = await PhantomStore.getItems();
    const items = allItems.filter(i =>
      (category === 'all' || i.category === category) &&
      (activeFilter === 'all' || i.type === activeFilter)
    );
    const filtered = items.filter(i => i.title.toLowerCase().includes(query) || i.username.toLowerCase().includes(query));

    if (filtered.length === 0) {
      row.innerHTML = '<div class="empty-msg" style="padding:10px 0;">No items found.</div>';
      return;
    }

    row.innerHTML = filtered.map(cardHtml).join('');
  }

  async function renderFilterChips(category) {
    const row = document.querySelector('.filter-chips[data-filterrow="' + category + '"]');
    if (!row) return;
    const allItems = await PhantomStore.getItems();
    const types = [...new Set(allItems.filter(i => i.category === category).map(i => i.type))];
    const active = categoryFilter[category] || 'all';

    const chips = ['all', ...types];
    row.innerHTML = chips.map(t => `
      <button class="filter-chip${t === active ? ' active' : ''}" onclick="setCategoryFilter('${category}', '${t}')">${t === 'all' ? 'All' : escapeHtml(t)}</button>
    `).join('');
  }

  function setCategoryFilter(category, type) {
    categoryFilter[category] = type;
    renderFilterChips(category);
    renderCategory(category);
  }

  async function renderTrending() {
    const row = document.querySelector('.recent-scroll[data-list="trending"]');
    if (!row) return;
    const allItems = await PhantomStore.getItems();
    const top = [...allItems].sort((a, b) => b.views - a.views).slice(0, 8);
    row.innerHTML = top.length ? top.map(cardHtml).join('') : '<div class="empty-msg" style="padding:10px 0;">Nothing trending yet.</div>';
  }

  // Discover rows on the All page. "Best" / "Trending" / "Most Downloaded" all
  // rank by views (the only popularity metric the store currently tracks —
  // add a real download counter in store.js if you want that one to differ).
  // Fantasy/Sci-Fi/Cyberpunk/Horror read item.theme, and Best Theme reads
  // item.featured — both set from the new fields in admin.html.
  const DISCOVER_ROWS = [
    { key: 'best', filter: items => [...items].sort((a, b) => b.views - a.views).slice(0, 8) },
    { key: 'trending2', filter: items => [...items].sort((a, b) => b.views - a.views).slice(0, 8) },
    { key: 'mostdl', filter: items => [...items].sort((a, b) => b.views - a.views).slice(0, 8) },
    { key: 'new', filter: items => [...items].sort((a, b) => b.id - a.id).slice(0, 8) },
    { key: 'featured', filter: items => items.filter(i => i.featured).slice(0, 8) },
    { key: 'fantasy', filter: items => items.filter(i => i.theme === 'fantasy').slice(0, 8) },
    { key: 'scifi', filter: items => items.filter(i => i.theme === 'scifi').slice(0, 8) },
    { key: 'cyberpunk', filter: items => items.filter(i => i.theme === 'cyberpunk').slice(0, 8) },
    { key: 'horror', filter: items => items.filter(i => i.theme === 'horror').slice(0, 8) }
  ];

  async function renderDiscoverRows() {
    const allItems = await PhantomStore.getItems();
    DISCOVER_ROWS.forEach(row => {
      const el = document.querySelector('.recent-scroll[data-discover="' + row.key + '"]');
      if (!el) return;
      const list = row.filter(allItems);
      el.innerHTML = list.length ? list.map(cardHtml).join('') : '<div class="empty-msg" style="padding:10px 0;">Nothing here yet.</div>';
    });
  }

  function renderAll() {
    ['assets', 'sfx', 'all'].forEach(renderCategory);
    ['assets', 'sfx'].forEach(renderFilterChips);
    renderTrending();
    renderDiscoverRows();
  }

  function shareItem() {
    if (!currentItem) return;
    const url = location.origin + location.pathname + '?item=' + currentItem.id;
    const note = document.getElementById('renderingNote');
    const showCopied = () => { note.textContent = 'Link copied!'; setTimeout(() => { if (note.textContent === 'Link copied!') note.textContent = ''; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(showCopied).catch(() => window.prompt('Copy this link:', url));
    } else {
      window.prompt('Copy this link:', url);
    }
  }

  async function openSharedItemFromUrl() {
    const id = new URLSearchParams(location.search).get('item');
    if (!id) return;
    const items = await PhantomStore.getItems();
    const item = items.find(i => i.id === Number(id));
    if (!item) return;
    showPage(item.category);
    openItem(item.id);
  }

  // ================== AI CHAT ==================
  // Conversation memory: kept in localStorage so it survives reloads, capped at
  // AI_MEMORY_LIMIT messages. The same array is sent back to the AI with every
  // new message so it has context and doesn't "forget" earlier in the chat.
  const AI_MEMORY_KEY = 'owliousAiMemory';
  const AI_MEMORY_LIMIT = 20;
  let aiMemory = loadAiMemory();
  let pendingAttachment = null; // { name, type, dataUrl }
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let isMicBusy = false;   // blocks overlapping mic taps while permission/start is in flight
  let isSending = false;   // blocks a second send firing before the first one finishes

  // Which AI backend the chat talks to. Pollinations needs no key at all, so
  // it's the only one that can actually run straight from this file — every
  // other option (OpenAI, Groq, Gemini, Cloudflare Workers AI) needs its own
  // server-side key, so those route through your /api/chat backend once it exists.
  const AI_MODEL_KEY = 'owliousAiModel';
  let selectedAiModel = localStorage.getItem(AI_MODEL_KEY) || 'pollinations';
  const AI_MODEL_LABELS = {
    pollinations: 'Pollinations',
    cloudflare: 'Cloudflare Workers AI',
    groq: 'Groq',
    gemini: 'Gemini',
    openai: 'OpenAI'
  };

  let isModelMenuOpen = false;

  function toggleModelMenu() {
    isModelMenuOpen = !isModelMenuOpen;
    document.getElementById('chatModelMenu').classList.toggle('open', isModelMenuOpen);
    if (isModelMenuOpen) updateModelMenuActiveState();
  }

  function closeModelMenu() {
    isModelMenuOpen = false;
    document.getElementById('chatModelMenu').classList.remove('open');
  }

  function selectAiModel(model) {
    selectedAiModel = model;
    try { localStorage.setItem(AI_MODEL_KEY, selectedAiModel); } catch (e) { /* storage unavailable */ }
    updateModelMenuActiveState();
    closeModelMenu();
  }

  function updateModelMenuActiveState() {
    document.querySelectorAll('.chat-model-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.model === selectedAiModel);
    });
    document.getElementById('chatModelPill').textContent = AI_MODEL_LABELS[selectedAiModel] || selectedAiModel;
  }

  // Close the model popup on an outside tap, not on the tap that opened it.
  document.addEventListener('click', function (e) {
    if (isModelMenuOpen && !e.target.closest('.chat-attach-wrap')) closeModelMenu();
  });

  function loadAiMemory() {
    try {
      const raw = localStorage.getItem(AI_MEMORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveAiMemory() {
    try {
      aiMemory = aiMemory.slice(-AI_MEMORY_LIMIT);
      localStorage.setItem(AI_MEMORY_KEY, JSON.stringify(aiMemory));
    } catch (e) { /* storage unavailable — chat still works, just won't persist */ }
  }

  function renderChatFromMemory() {
    const box = document.getElementById('chatMessages');
    box.innerHTML = '';
    aiMemory.forEach(m => appendChatBubble(m.role, m.text, m.file, false));
    box.scrollTop = box.scrollHeight;
  }

  function appendChatBubble(role, text, file, scroll) {
    if (scroll === undefined) scroll = true;
    const box = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.innerHTML = escapeHtml(text || '').replace(/\n/g, '<br>');
    if (file) {
      if (file.type && file.type.startsWith('image/')) {
        const img = document.createElement('img');
        img.className = 'msg-thumb'; img.src = file.dataUrl;
        div.appendChild(img);
      } else if (file.type === 'audio') {
        const audio = document.createElement('audio');
        audio.className = 'msg-audio'; audio.controls = true; audio.src = file.dataUrl;
        div.appendChild(audio);
      } else {
        const span = document.createElement('span');
        span.className = 'msg-file';
        span.innerHTML = '<svg viewBox="0 0 24 24" class="chat-model-item-icon" style="stroke:currentColor;vertical-align:-2px;margin-right:4px;"><path d="M21 12.5V7a2 2 0 0 0-2-2H8L4 9v8a2 2 0 0 0 2 2h4"/><path d="M14 21l6-6M14 15h6v6"/></svg>' + escapeHtml(file.name);
        div.appendChild(span);
      }
    }
    box.appendChild(div);
    if (scroll) box.scrollTop = box.scrollHeight;
    return div;
  }

  function autoGrowChatInput(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  function onChatKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendChatMessage();
    }
  }

  function onChatFilePicked(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingAttachment = { name: file.name, type: file.type, dataUrl: reader.result };
      renderAttachPreview();
    };
    reader.readAsDataURL(file);
  }

  function renderAttachPreview() {
    const row = document.getElementById('chatAttachPreview');
    if (!pendingAttachment) { row.innerHTML = ''; return; }
    row.innerHTML =
      '<div class="chat-attach-chip">' +
      '<svg viewBox="0 0 24 24" class="chat-model-item-icon"><path d="M21 12.5V7a2 2 0 0 0-2-2H8L4 9v8a2 2 0 0 0 2 2h4"/><path d="M14 21l6-6M14 15h6v6"/></svg>' +
      escapeHtml(pendingAttachment.name) +
      '<button onclick="clearAttachment()"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>';
  }

  function clearAttachment() {
    pendingAttachment = null;
    document.getElementById('chatFileInput').value = '';
    renderAttachPreview();
  }

  async function toggleVoiceRecording() {
    if (isMicBusy) return;
    if (isRecording) { if (mediaRecorder) mediaRecorder.stop(); return; }
    isMicBusy = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        isRecording = false;
        document.getElementById('chatMicBtn').classList.remove('recording');
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => {
          pendingAttachment = { name: 'Voice message', type: 'audio', dataUrl: reader.result };
          renderAttachPreview();
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('chatMicBtn').classList.add('recording');
    } catch (e) {
      appendChatBubble('ai', "Couldn't access the microphone.");
    } finally {
      isMicBusy = false;
    }
  }

  async function sendChatMessage() {
    if (isSending) return; // ignore a second tap while the first message is still in flight
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text && !pendingAttachment) return;

    isSending = true;
    const sendBtn = document.getElementById('chatSendBtn');
    sendBtn.disabled = true;
    let thinkingEl = null;

    // Everything is inside try/finally so the send lock ALWAYS releases, and any
    // failure is shown in the chat instead of failing silently.
    try {
      const userMsg = { role: 'user', text: text, file: pendingAttachment, ts: Date.now() };
      aiMemory.push(userMsg);
      appendChatBubble('user', text, pendingAttachment);

      input.value = '';
      autoGrowChatInput(input);
      clearAttachment();
      saveAiMemory();

      thinkingEl = appendChatBubble('ai', '...');
      const reply = await getAIResponse(text, userMsg.file, aiMemory);
      thinkingEl.remove();
      thinkingEl = null;
      aiMemory.push({ role: 'ai', text: reply, ts: Date.now() });
      appendChatBubble('ai', reply);
      saveAiMemory();
    } catch (e) {
      if (thinkingEl) thinkingEl.remove();
      showChatError(e);
    } finally {
      isSending = false;
      sendBtn.disabled = false;
    }
  }

  // Puts a readable error in the chat (with the real reason) so failures are visible.
  function showChatError(e) {
    let msg;
    if (e && e.name === 'AbortError') {
      msg = 'That model took too long to respond. Try again, or switch models with the + button.';
    } else if (selectedAiModel !== 'pollinations') {
      msg = 'The ' + (AI_MODEL_LABELS[selectedAiModel] || selectedAiModel) +
        ' model needs your own backend (/api/chat), which is not set up yet. Switch to Pollinations with the + button to chat now.';
    } else {
      msg = "Couldn't reach the AI right now. Try again in a moment.";
    }
    const detail = e && e.message ? '\n[' + e.message + ']' : '';
    try { appendChatBubble('ai', msg + detail); } catch (_) { /* nothing more we can do */ }
  }

  // Safety net: any uncaught error shows up in the chat instead of vanishing.
  window.addEventListener('error', function (ev) {
    try { appendChatBubble('ai', 'Error: ' + ev.message); } catch (_) {}
  });
  window.addEventListener('unhandledrejection', function (ev) {
    try { appendChatBubble('ai', 'Error: ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason)); } catch (_) {}
  });

  // Every AI fetch goes through this so a slow or hung endpoint (Pollinations
  // in particular can be unreliable) can't leave the send button stuck
  // forever — it gives up after TIMEOUT_MS and throws, which sendChatMessage
  // catches and turns into a visible error instead of an endless "...".
  const AI_FETCH_TIMEOUT_MS = 20000;
  async function fetchWithTimeout(url, options) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), AI_FETCH_TIMEOUT_MS);
    try {
      return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
    } finally {
      clearTimeout(timer);
    }
  }

  // Point this at your own backend (e.g. the Render API), which calls the AI
  // provider server-side. Never put a real API key in this file — anyone who
  // views the page source would be able to read and use it.
  async function getAIResponse(text, file, history) {
    if (selectedAiModel === 'pollinations') {
      return getPollinationsResponse(text, history);
    }

    const res = await fetchWithTimeout('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: selectedAiModel,
        message: text,
        history: history.slice(-AI_MEMORY_LIMIT).map(m => ({ role: m.role, text: m.text }))
        // add 'file' here too once your backend accepts attachments
      })
    });
    if (!res.ok) throw new Error('Bad response');
    const data = await res.json();
    return data.reply || "I didn't get a response.";
  }

  // Pollinations' text API needs no key, so this call can genuinely run
  // straight from the browser — the only model here that works with zero
  // backend setup. https://text.pollinations.ai/openai is OpenAI-compatible.
  async function getPollinationsResponse(text, history) {
    const messages = history.slice(-AI_MEMORY_LIMIT)
      .filter(m => m.text)
      .map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.text }));
    messages.push({ role: 'user', content: text });

    const res = await fetchWithTimeout('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'openai', messages: messages })
    });
    if (!res.ok) throw new Error('Bad response');
    const data = await res.json();
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content)
      || "I didn't get a response.";
  }

  async function openItem(id) {
    const items = await PhantomStore.getItems();
    const item = items.find(i => i.id === id);
    if (!item) return;
    PhantomStore.registerView(id);
    renderCategory(item.category);

    currentItem = item;
    userImageEl = null;
    userAudioBuffer = null;
    renderedAudioBlob = null;

    document.getElementById('viewTitle').textContent = item.title;
    document.getElementById('viewUser').textContent = 'Made by ' + item.username;
    document.getElementById('viewType').textContent = item.type;
    document.getElementById('viewViews').textContent = item.views + ' views';

    const def = EFFECT_TYPES[item.effectType];
    const isAudio = def && def.kind === 'audio';
    document.getElementById('dropZone').textContent = isAudio
      ? 'Click to upload your own audio to apply this effect to'
      : 'Click to upload your own image to apply this effect to';
    document.getElementById('userFileInput').accept = isAudio ? 'audio/*' : 'image/*';

    document.getElementById('previewCanvas').style.display = 'none';
    document.getElementById('previewAudioBox').style.display = 'none';
    document.getElementById('downloadBtn').disabled = true;
    document.getElementById('renderingNote').textContent = '';
    document.getElementById('userFileInput').value = '';

    stopPlayback();
    playheadTime = 0;
    animConfig[item.id] = {};
    paramValues[item.id] = Object.assign({}, item.params);
    renderViewParams(item);
    hideTimeline();

    document.getElementById('overlay').classList.add('active');
    document.getElementById('viewPanel').classList.add('active');
  }

  function renderViewParams(item) {
    const container = document.getElementById('viewParams');
    const def = EFFECT_TYPES[item.effectType];
    if (!def || !def.params.length) { container.style.display = 'none'; container.innerHTML = ''; return; }
    container.style.display = 'block';

    if (def.kind === 'image') {
      container.innerHTML = '<div class="params-heading">Adjust</div>' +
        def.params.map(p => `<div class="param-block" data-key="${p.key}"></div>`).join('');
      def.params.forEach(p => renderAnimatableParamBlock(item, p));
    } else {
      container.innerHTML = '<div class="params-heading">Adjust</div>' +
        def.params.map(p => paramControlHtml('view', item.id, p, paramValues[item.id][p.key])).join('');
    }
  }

  // --- Image params: each slider can be left static, or "Animate"d over a
  // timeline with its own start/end value and an easing envelope you shape
  // by dragging the handles. Color/toggle params stay static (no timeline). ---
  function renderAnimatableParamBlock(item, p) {
    const block = document.querySelector(`.param-block[data-key="${p.key}"]`);
    if (!block) return;
    const value = paramValues[item.id][p.key];

    let html = paramControlHtml('view', item.id, p, value);
    if (p.type !== 'color' && p.type !== 'toggle') {
      // splice an Animate checkbox into the row (paramControlHtml doesn't include one)
      html = html.replace('</div>', `<label class="anim-toggle"><input type="checkbox" onchange="toggleAnimate(${item.id}, '${p.key}', this.checked)"> Animate</label></div>`);
    }
    block.innerHTML = html;

    if (p.type !== 'color' && p.type !== 'toggle') {
      const cfgDiv = document.createElement('div');
      cfgDiv.className = 'anim-config';
      cfgDiv.id = 'animCfg_' + item.id + '_' + p.key;
      cfgDiv.style.display = 'none';
      cfgDiv.innerHTML = `
        <div class="anim-row"><span>Start</span><input type="number" step="${p.step || 1}" value="${p.min}" oninput="updateAnimField(${item.id}, '${p.key}', 'start', this.value)"></div>
        <div class="anim-row"><span>End</span><input type="number" step="${p.step || 1}" value="${p.max}" oninput="updateAnimField(${item.id}, '${p.key}', 'end', this.value)"></div>
        <div class="anim-row"><span>Duration (s)</span><input type="number" step="0.1" min="0.2" value="2" oninput="updateAnimField(${item.id}, '${p.key}', 'duration', this.value)"></div>
        <div class="anim-row"><span>Ease curve</span><span style="flex:1; font-size:10px; color:#666;">drag the dots</span></div>
      `;
      const tpl = document.getElementById('envelopeTemplate').content.cloneNode(true);
      cfgDiv.appendChild(tpl);
      block.appendChild(cfgDiv);

      animConfig[item.id][p.key] = {
        enabled: false, start: p.min, end: p.max, duration: 2,
        nodes: [0, 0.25, 0.5, 0.75, 1].map(t => ({ t, v: t }))
      };
      initEnvelope(cfgDiv.querySelector('.envelope-box'), item.id, p.key);
    }
  }

  function toggleAnimate(itemId, key, enabled) {
    animConfig[itemId][key].enabled = enabled;
    const cfg = document.getElementById('animCfg_' + itemId + '_' + key);
    if (cfg) cfg.style.display = enabled ? 'block' : 'none';
    const block = document.querySelector(`.param-block[data-key="${key}"]`);
    const rangeInput = block ? block.querySelector('input[type="range"]') : null;
    if (rangeInput) rangeInput.disabled = enabled;
    recomputeTimeline(itemId);
  }

  function updateAnimField(itemId, key, field, value) {
    animConfig[itemId][key][field] = Number(value);
    recomputeTimeline(itemId);
  }

  // --- Envelope editor: 5 fixed-time handles, vertically draggable ---
  function envelopeXY(node) {
    return { x: node.t * 160, y: (1 - node.v) * 90 };
  }

  function redrawEnvelope(svg, nodes) {
    const poly = svg.querySelector('.envelope-line');
    poly.setAttribute('points', nodes.map(n => { const p = envelopeXY(n); return p.x + ',' + p.y; }).join(' '));
    svg.querySelectorAll('.envelope-handle').forEach((h, i) => {
      const p = envelopeXY(nodes[i]);
      h.setAttribute('cx', p.x);
      h.setAttribute('cy', p.y);
    });
  }

  function initEnvelope(svg, itemId, key) {
    const nodes = animConfig[itemId][key].nodes;
    nodes.forEach((n, i) => {
      const handle = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      handle.setAttribute('class', 'envelope-handle');
      handle.setAttribute('rx', 5);
      handle.setAttribute('ry', 5);
      svg.appendChild(handle);

      handle.onpointerdown = (e) => {
        handle.setPointerCapture(e.pointerId);
        const box = svg.getBoundingClientRect();
        const onMove = (ev) => {
          const y = Math.min(90, Math.max(0, (ev.clientY - box.top) * (90 / box.height)));
          nodes[i].v = 1 - (y / 90);
          redrawEnvelope(svg, nodes);
          if (animConfig[itemId][key].enabled) applyPlayhead();
        };
        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      };
    });
    redrawEnvelope(svg, nodes);
  }

  function sampleEnvelope(nodes, t) {
    t = Math.min(1, Math.max(0, t));
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i + 1];
      if (t >= a.t && t <= b.t) {
        const localT = (b.t - a.t) === 0 ? 0 : (t - a.t) / (b.t - a.t);
        return a.v + (b.v - a.v) * localT;
      }
    }
    return nodes[nodes.length - 1].v;
  }

  // --- Timeline: shared scrub bar drives every animated param at once ---
  function recomputeTimeline(itemId) {
    const cfgs = Object.values(animConfig[itemId] || {}).filter(c => c.enabled);
    if (cfgs.length === 0) { hideTimeline(); return; }
    maxDuration = Math.max(0.2, ...cfgs.map(c => c.duration));
    document.getElementById('timelineSection').style.display = 'block';
    playheadTime = Math.min(playheadTime, maxDuration);
    document.getElementById('timelineScrub').value = playheadTime / maxDuration;
    applyPlayhead();
  }

  function hideTimeline() {
    document.getElementById('timelineSection').style.display = 'none';
    document.getElementById('timelineScrub').value = 0;
    document.getElementById('timelineTimeLabel').textContent = '0.0s';
  }

  function onScrub(normalized) {
    stopPlayback();
    playheadTime = Number(normalized) * maxDuration;
    applyPlayhead();
  }

  function applyPlayhead() {
    if (!currentItem) return;
    const cfg = animConfig[currentItem.id] || {};
    Object.keys(cfg).forEach(key => {
      const c = cfg[key];
      if (!c.enabled) return;
      const t = c.duration > 0 ? playheadTime / c.duration : 1;
      const progress = sampleEnvelope(c.nodes, t);
      paramValues[currentItem.id][key] = c.start + (c.end - c.start) * progress;
    });
    document.getElementById('timelineTimeLabel').textContent = playheadTime.toFixed(1) + 's';
    renderImagePreview();
  }

  function togglePlay() {
    if (isPlaying) { stopPlayback(); return; }
    isPlaying = true;
    playLastTs = null;
    document.getElementById('playBtn').innerHTML = '&#10074;&#10074; Pause';
    playRafId = requestAnimationFrame(playTick);
  }

  function stopPlayback() {
    isPlaying = false;
    if (playRafId) cancelAnimationFrame(playRafId);
    playRafId = null;
    const btn = document.getElementById('playBtn');
    if (btn) btn.innerHTML = '&#9654; Play';
  }

  function playTick(ts) {
    if (!isPlaying) return;
    if (playLastTs == null) playLastTs = ts;
    const delta = (ts - playLastTs) / 1000;
    playLastTs = ts;
    playheadTime += delta;
    if (playheadTime >= maxDuration) { playheadTime = 0; }
    document.getElementById('timelineScrub').value = playheadTime / maxDuration;
    applyPlayhead();
    playRafId = requestAnimationFrame(playTick);
  }

  function onParamInput(scope, itemId, key, value) {
    if (!currentItem || currentItem.id !== itemId) return;
    const def = EFFECT_TYPES[currentItem.effectType];
    const paramDef = def.params.find(p => p.key === key);
    paramValues[itemId][key] = paramDef.type === 'toggle' ? value : (paramDef.type === 'color' ? value : Number(value));
    if (def.kind === 'image') {
      renderImagePreview();
    } else {
      scheduleAudioRender();
    }
  }

  // --- Image path: canvas draws live, "download" just exports the canvas ---
  function onUserFilePicked(event) {
    const file = event.target.files[0];
    if (!file || !currentItem) return;
    const def = EFFECT_TYPES[currentItem.effectType];

    if (def.kind === 'image') {
      const img = new Image();
      img.onload = () => {
        userImageEl = img;
        const canvas = document.getElementById('previewCanvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.style.display = 'block';
        document.getElementById('previewAudioBox').style.display = 'none';
        document.getElementById('downloadBtn').disabled = false;
        renderImagePreview();
      };
      img.src = URL.createObjectURL(file);
    } else {
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          userAudioBuffer = await ctx.decodeAudioData(reader.result);
          document.getElementById('previewCanvas').style.display = 'none';
          document.getElementById('previewAudioBox').style.display = 'block';
          document.getElementById('downloadBtn').disabled = false;
          scheduleAudioRender();
        } catch (e) {
          document.getElementById('renderingNote').textContent = 'Could not read that audio file.';
        }
      };
      reader.readAsArrayBuffer(file);
    }
  }

  function renderImagePreview() {
    if (!userImageEl || !currentItem) return;
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const def = EFFECT_TYPES[currentItem.effectType];
    def.apply(ctx, canvas, userImageEl, paramValues[currentItem.id]);
  }

  function downloadResult() {
    if (!currentItem) return;
    const def = EFFECT_TYPES[currentItem.effectType];
    if (def.kind === 'image') {
      const canvas = document.getElementById('previewCanvas');
      canvas.toBlob(blob => triggerDownload(blob, currentItem.title.replace(/\s+/g, '_') + '.png'));
    } else if (renderedAudioBlob) {
      triggerDownload(renderedAudioBlob, currentItem.title.replace(/\s+/g, '_') + '.wav');
    }
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // --- Audio path: re-render offline whenever a param changes (debounced),
  // then point the <audio> element at the rendered result ---
  function scheduleAudioRender() {
    clearTimeout(audioRenderTimer);
    document.getElementById('renderingNote').textContent = 'Rendering...';
    audioRenderTimer = setTimeout(renderAudioNow, 250);
  }

  async function renderAudioNow() {
    if (!userAudioBuffer || !currentItem) return;
    const def = EFFECT_TYPES[currentItem.effectType];
    const offlineCtx = new OfflineAudioContext(
      userAudioBuffer.numberOfChannels,
      userAudioBuffer.length,
      userAudioBuffer.sampleRate
    );
    def.apply(offlineCtx, userAudioBuffer, paramValues[currentItem.id]);
    const rendered = await offlineCtx.startRendering();
    renderedAudioBlob = audioBufferToWavBlob(rendered);
    const audioEl = document.getElementById('previewAudio');
    audioEl.src = URL.createObjectURL(renderedAudioBlob);
    document.getElementById('renderingNote').textContent = '';
  }

  // Minimal 16-bit PCM WAV encoder so the rendered result is downloadable —
  // OfflineAudioContext only gives us an AudioBuffer, not a file.
  function audioBufferToWavBlob(buffer) {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const length = buffer.length * numChannels * 2 + 44;
    const bufArr = new ArrayBuffer(length);
    const view = new DataView(bufArr);

    function writeString(offset, str) { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); }

    writeString(0, 'RIFF');
    view.setUint32(4, length - 8, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * numChannels * 2, true);
    view.setUint16(32, numChannels * 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, length - 44, true);

    const channels = [];
    for (let c = 0; c < numChannels; c++) channels.push(buffer.getChannelData(c));
    let offset = 44;
    for (let i = 0; i < buffer.length; i++) {
      for (let c = 0; c < numChannels; c++) {
        const sample = Math.max(-1, Math.min(1, channels[c][i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
        offset += 2;
      }
    }
    return new Blob([bufArr], { type: 'audio/wav' });
  }

  function closeAllPanels() {
    stopPlayback();
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('viewPanel').classList.remove('active');
  }

  showPage('assets');
  renderAll();
  openSharedItemFromUrl();
  renderChatFromMemory();
  updateModelMenuActiveState();
</script>

</body>
</html>
